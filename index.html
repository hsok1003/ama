<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMA">
<title>AMA - Auto Marking App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0a0a0f; --card: #14141f; --border: #2a2a3a;
    --text: #e8e8f0; --muted: #8888a0;
    --orange: #ff8c32; --cyan: #00d4ff; --purple: #7c5cfc;
    --green: #22cc88; --red: #ff4466;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh; overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .header {
    padding: 10px 20px; padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); background: var(--card);
  }
  .header h1 {
    font-size: 18px; font-weight: 900;
    background: linear-gradient(135deg, var(--orange), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: var(--purple); color: #fff; font-weight: 600; }

  .steps { display: flex; justify-content: center; padding: 14px 20px 10px; }
  .step-dot {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; background: var(--border); color: var(--muted); transition: all 0.3s;
  }
  .step-dot.active { background: var(--purple); color: #fff; }
  .step-dot.done { background: var(--green); color: #fff; }
  .step-line { width: 28px; height: 2px; background: var(--border); align-self: center; transition: background 0.3s; }
  .step-line.active { background: var(--purple); }
  .step-label { font-size: 8px; text-align: center; color: var(--muted); margin-top: 3px; }
  .step-label.active { color: var(--text); }

  .section { padding: 14px 20px; }
  .section-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin-bottom: 10px; }

  .input-group { display: flex; gap: 12px; margin-bottom: 12px; }
  .input-card {
    flex: 1; background: var(--card); border: 2px solid var(--border);
    border-radius: 14px; padding: 12px; text-align: center;
  }
  .input-card.w { border-color: var(--orange); }
  .input-card.d { border-color: var(--cyan); }
  .input-card label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .input-card input {
    width: 100%; background: transparent; border: none; color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600;
    text-align: center; outline: none;
  }
  .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

  .result-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .result-card {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; text-align: center;
  }
  .result-card .l { font-size: 9px; color: var(--muted); margin-bottom: 2px; }
  .result-card .v { font-size: 16px; font-weight: 700; }

  .spacing-info { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin: 0 20px 12px; }
  .spacing-info .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .spacing-info .row .l { font-size: 11px; color: var(--muted); }
  .spacing-info .row .v { font-size: 12px; font-weight: 600; }

  .diagram-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 0 20px 12px; }
  .diagram-wrap .title { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; margin-bottom: 10px; }
  .diagram-wrap canvas { width: 100%; aspect-ratio: 1.2; display: block; }

  .point-list { margin: 0 20px 12px; }
  .point-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
  .point-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }
  .point-num.c { background: var(--red); }
  .point-num.o { background: var(--orange); }
  .point-info { flex: 1; }
  .point-info .n { font-size: 12px; font-weight: 600; }
  .point-info .co { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .btn {
    display: block; width: calc(100% - 40px); margin: 0 20px 12px; padding: 14px;
    border: none; border-radius: 12px; font-family: 'Noto Sans KR'; font-size: 15px; font-weight: 700;
    color: #fff; cursor: pointer; text-align: center;
  }
  .btn:active { transform: scale(0.97); opacity: 0.9; }
  .btn.purple { background: linear-gradient(135deg, var(--purple), #5a3fd4); }
  .btn.green { background: linear-gradient(135deg, var(--green), #18a870); }
  .btn:disabled { opacity: 0.4; }

  .action-row { display: flex; gap: 8px; margin: 0 20px 12px; }
  .action-btn {
    flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font-family: 'Noto Sans KR';
    font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
  }

  /* ★ 카메라 + 오버레이 */
  .cam-container {
    position: relative; margin: 0 20px 12px; border-radius: 14px; overflow: hidden; background: #000;
  }
  .cam-container video { width: 100%; display: block; }
  .cam-container .overlay-canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .cam-controls {
    display: flex; align-items: center; gap: 10px; margin: 0 20px 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
  }
  .cam-controls label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .cam-controls input[type=range] { flex: 1; accent-color: var(--purple); }
  .cam-info-bar {
    display: flex; gap: 6px; margin: 0 20px 8px;
  }
  .cam-info-tag {
    flex: 1; text-align: center; padding: 6px; border-radius: 8px;
    font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace;
    background: var(--card); border: 1px solid var(--border);
  }
  .cam-guide {
    margin: 0 20px 12px; padding: 10px 14px; border-radius: 10px;
    background: rgba(124,92,252,0.15); border: 1px solid rgba(124,92,252,0.3);
    font-size: 12px; color: var(--text); line-height: 1.6;
  }

  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--green); color: #fff; padding: 10px 24px; border-radius: 20px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .bottom-safe { height: env(safe-area-inset-bottom, 20px); }
</style>
</head>
<body>

<div class="header">
  <h1>AMA</h1>
  <span class="badge">Auto Marking App</span>
</div>

<div class="steps" id="steps">
  <div><div class="step-dot active" id="s1">1</div><div class="step-label active">입력</div></div>
  <div class="step-line" id="l1"></div>
  <div><div class="step-dot" id="s2">2</div><div class="step-label">계산</div></div>
  <div class="step-line" id="l2"></div>
  <div><div class="step-dot" id="s3">3</div><div class="step-label">현장</div></div>
</div>

<!-- Page 1: 입력 -->
<div id="p1">
  <div class="section">
    <div class="section-title">바닥 치수 입력</div>
    <div class="input-group">
      <div class="input-card w">
        <label><span class="cdot" style="background:var(--orange)"></span>가로 (m)</label>
        <input type="number" id="wIn" step="0.01" min="0.5" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="input-card d">
        <label><span class="cdot" style="background:var(--cyan)"></span>세로 (m)</label>
        <input type="number" id="dIn" step="0.01" min="0.5" placeholder="0.00" inputmode="decimal">
      </div>
    </div>
  </div>
  <button class="btn purple" id="calcBtn" disabled onclick="calc()">포인트 계산하기</button>
</div>

<!-- Page 2: 결과 -->
<div id="p2" style="display:none">
  <div class="section" style="padding-bottom:6px">
    <div class="result-row">
      <div class="result-card"><div class="l">면적</div><div class="v mono" id="rArea" style="color:var(--green)">--</div></div>
      <div class="result-card"><div class="l">간격</div><div class="v mono" id="rSp" style="color:var(--purple)">--</div></div>
      <div class="result-card"><div class="l">대각선</div><div class="v mono" id="rDiag" style="color:var(--orange)">--</div></div>
    </div>
  </div>
  <div class="spacing-info" id="spInfo"></div>
  <div class="diagram-wrap"><div class="title">포인트 배치도 (역Z 패턴)</div><canvas id="dCanvas"></canvas></div>
  <div class="section-title" style="padding:0 20px;margin-bottom:6px">포인트 좌표 (기준점에서 거리)</div>
  <div class="point-list" id="pList"></div>
  <button class="btn green" onclick="goStep(3)">📷 카메라로 현장 확인</button>
  <div class="action-row">
    <button class="action-btn" onclick="share()">📤 결과 공유</button>
    <button class="action-btn" onclick="resetAll()">🔄 다시 측정</button>
  </div>
</div>

<!-- Page 3: 카메라 + 오버레이 -->
<div id="p3" style="display:none">
  <div class="cam-info-bar">
    <div class="cam-info-tag" style="color:var(--orange)">가로 <span id="cW">--</span></div>
    <div class="cam-info-tag" style="color:var(--cyan)">세로 <span id="cD">--</span></div>
    <div class="cam-info-tag" style="color:var(--green)">간격 <span id="cS">--</span></div>
    <div class="cam-info-tag" style="color:var(--purple)"><span id="cA">--</span></div>
  </div>

  <div class="cam-guide">
    💡 카메라를 바닥을 향해 비추세요. 반투명 배치도가 표시됩니다.<br>
    크기/투명도를 조절하여 실제 바닥과 맞춰보세요.
  </div>

  <div class="cam-container" id="camBox">
    <video id="camVid" autoplay playsinline muted></video>
    <canvas class="overlay-canvas" id="olCanvas"></canvas>
  </div>

  <div class="cam-controls">
    <label>크기</label>
    <input type="range" id="sizeSlider" min="30" max="95" value="70" oninput="drawOL()">
    <label>투명도</label>
    <input type="range" id="alphaSlider" min="20" max="90" value="60" oninput="drawOL()">
  </div>

  <div class="diagram-wrap"><div class="title">배치도 참고</div><canvas id="dCanvas2"></canvas></div>

  <div class="action-row">
    <button class="action-btn" onclick="goStep(2)">← 결과</button>
    <button class="action-btn" onclick="share()">📤 공유</button>
    <button class="action-btn" onclick="resetAll()">🔄 리셋</button>
  </div>
</div>

<div class="bottom-safe"></div>
<div class="toast" id="toast"></div>

<script>
let S = { w:0, d:0, area:0, sp:0, pts:[], diag:0 };
const wIn = document.getElementById('wIn'), dIn = document.getElementById('dIn');
const calcBtn = document.getElementById('calcBtn');

function chk() { calcBtn.disabled = !(parseFloat(wIn.value)>0 && parseFloat(dIn.value)>0); }
wIn.addEventListener('input', chk); dIn.addEventListener('input', chk);

function calc() {
  const w = parseFloat(wIn.value), d = parseFloat(dIn.value);
  if(!w||!d) return;
  S.w=w; S.d=d; S.area=w*d; S.sp = S.area<14 ? 0.50 : 0.75;
  const s=S.sp, sw=Math.min(s,w/3), sd=Math.min(s,d/3);
  const p1={id:1,lb:'우상',x:w-sw,y:sd};
  const p2={id:2,lb:'좌상',x:sw,y:sd};
  const p4={id:4,lb:'우하',x:w-sw,y:d-sd};
  const p5={id:5,lb:'좌하',x:sw,y:d-sd};
  const p3={id:3,lb:'중앙',x:(p1.x+p5.x)/2,y:(p1.y+p5.y)/2};
  S.pts=[p1,p2,p3,p4,p5];
  S.diag=Math.sqrt((p1.x-p5.x)**2+(p1.y-p5.y)**2);
  goStep(2); renderResults(); drawDiag('dCanvas');
}

function renderResults() {
  document.getElementById('rArea').textContent=S.area.toFixed(1)+'m²';
  document.getElementById('rSp').textContent=S.sp.toFixed(2)+'m';
  document.getElementById('rDiag').textContent=S.diag.toFixed(2)+'m';
  const sw=Math.min(S.sp,S.w/3), sd=Math.min(S.sp,S.d/3);
  document.getElementById('spInfo').innerHTML=`
    <div class="row"><span class="l">가로</span><span class="v mono" style="color:var(--orange)">${S.w.toFixed(2)}m</span></div>
    <div class="row"><span class="l">세로</span><span class="v mono" style="color:var(--cyan)">${S.d.toFixed(2)}m</span></div>
    <div class="row"><span class="l">기준</span><span class="v" style="color:var(--muted)">${S.area<14?'14m²미만→0.50m':'14m²이상→0.75m'}</span></div>
    <div class="row"><span class="l">가로 벽→포인트</span><span class="v mono" style="color:var(--green)">${sw.toFixed(2)}m</span></div>
    <div class="row"><span class="l">세로 벽→포인트</span><span class="v mono" style="color:var(--green)">${sd.toFixed(2)}m</span></div>`;
  document.getElementById('pList').innerHTML=S.pts.map(p=>`
    <div class="point-item">
      <div class="point-num ${p.id===3?'c':'o'}">${p.id}</div>
      <div class="point-info">
        <div class="n">${p.lb}</div>
        <div class="co">가로 ${p.x.toFixed(2)}m · 세로 ${p.y.toFixed(2)}m</div>
      </div>
    </div>`).join('');
}

// ★ 배치도 그리기
function drawDiag(id) {
  const cvs=document.getElementById(id);
  const r=cvs.parentElement.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  cvs.width=r.width*dpr; cvs.height=r.width/1.2*dpr;
  cvs.style.height=r.width/1.2+'px';
  const ctx=cvs.getContext('2d'); ctx.scale(dpr,dpr);
  const W=r.width, H=r.width/1.2, pad=36;
  const sx=(W-pad*2)/S.w, sy=(H-pad*2)/S.d, sc=Math.min(sx,sy);
  const ox=(W-S.w*sc)/2, oy=(H-S.d*sc)/2;
  const tx=x=>ox+x*sc, ty=y=>oy+y*sc;
  ctx.clearRect(0,0,W,H);

  // Room
  ctx.strokeStyle='#7c5cfc'; ctx.lineWidth=2;
  ctx.strokeRect(tx(0),ty(0),S.w*sc,S.d*sc);
  ctx.fillStyle='rgba(124,92,252,0.05)';
  ctx.fillRect(tx(0),ty(0),S.w*sc,S.d*sc);

  // Inner rect
  const sw=Math.min(S.sp,S.w/3), sd=Math.min(S.sp,S.d/3);
  ctx.strokeStyle='rgba(34,204,136,0.5)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.strokeRect(tx(sw),ty(sd),(S.w-sw*2)*sc,(S.d-sd*2)*sc);
  ctx.setLineDash([]);

  // Spacing labels
  ctx.fillStyle='#22cc88'; ctx.font='10px "JetBrains Mono"'; ctx.textAlign='center';
  ctx.fillText(sd.toFixed(2)+'m',tx(S.w/2),ty(sd/2)+4);
  ctx.save(); ctx.translate(tx(sw/2),ty(S.d/2)); ctx.rotate(-Math.PI/2);
  ctx.fillText(sw.toFixed(2)+'m',0,4); ctx.restore();

  // Diagonals
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(tx(S.pts[0].x),ty(S.pts[0].y)); ctx.lineTo(tx(S.pts[4].x),ty(S.pts[4].y)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx(S.pts[1].x),ty(S.pts[1].y)); ctx.lineTo(tx(S.pts[3].x),ty(S.pts[3].y)); ctx.stroke();
  ctx.setLineDash([]);

  // Corner box
  ctx.strokeStyle='rgba(255,140,50,0.3)'; ctx.beginPath();
  ctx.moveTo(tx(S.pts[1].x),ty(S.pts[1].y)); ctx.lineTo(tx(S.pts[0].x),ty(S.pts[0].y));
  ctx.lineTo(tx(S.pts[3].x),ty(S.pts[3].y)); ctx.lineTo(tx(S.pts[4].x),ty(S.pts[4].y));
  ctx.closePath(); ctx.stroke();

  // Wall labels
  ctx.font='bold 11px "JetBrains Mono"'; ctx.textAlign='center';
  ctx.fillStyle='#ff8c32'; ctx.fillText('가로 '+S.w.toFixed(2)+'m',tx(S.w/2),ty(0)-8);
  ctx.fillStyle='#00d4ff';
  ctx.save(); ctx.translate(tx(S.w)+14,ty(S.d/2)); ctx.rotate(Math.PI/2);
  ctx.fillText('세로 '+S.d.toFixed(2)+'m',0,0); ctx.restore();

  // Points
  S.pts.forEach(p=>{
    const x=tx(p.x),y=ty(p.y),ic=p.id===3,r=ic?13:11;
    ctx.beginPath(); ctx.arc(x,y,r+3,0,Math.PI*2);
    ctx.fillStyle=ic?'rgba(255,68,102,0.2)':'rgba(255,140,50,0.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=ic?'#ff4466':'#ff8c32'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`bold ${ic?12:10}px "Noto Sans KR"`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.id,x,y);
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='8px "Noto Sans KR"';
    ctx.fillText(p.lb,x,y+r+10);
  });

  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='10px "JetBrains Mono"';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(S.area.toFixed(1)+'m²',tx(S.w/2),ty(S.d)+8);
}

// ★ 카메라 오버레이 (포인트 배치도를 카메라 위에 그림)
function drawOL() {
  const cvs=document.getElementById('olCanvas');
  const vid=document.getElementById('camVid');
  const W=cvs.width, H=cvs.height;
  if(!W||!H) return;
  const ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,W,H);

  const sizePct = parseInt(document.getElementById('sizeSlider').value)/100;
  const alphaPct = parseInt(document.getElementById('alphaSlider').value)/100;

  // 배치도 크기/위치 계산
  const roomAspect = S.w/S.d;
  const maxW = W*sizePct, maxH = H*sizePct;
  let rW, rH;
  if(maxW/maxH > roomAspect) { rH=maxH; rW=rH*roomAspect; }
  else { rW=maxW; rH=rW/roomAspect; }
  const rx=(W-rW)/2, ry=(H-rH)/2;

  const tx=x=>rx+(x/S.w)*rW;
  const ty=y=>ry+(y/S.d)*rH;

  ctx.globalAlpha = alphaPct;

  // 바닥 경계선 (보라색)
  ctx.strokeStyle='#7c5cfc'; ctx.lineWidth=3;
  ctx.strokeRect(rx,ry,rW,rH);

  // 치수 텍스트
  ctx.fillStyle='#ff8c32'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('가로 '+S.w.toFixed(2)+'m', rx+rW/2, ry-10);
  ctx.fillStyle='#00d4ff';
  ctx.save(); ctx.translate(rx+rW+14, ry+rH/2); ctx.rotate(Math.PI/2);
  ctx.fillText('세로 '+S.d.toFixed(2)+'m', 0, 0); ctx.restore();

  // 안쪽 영역 (녹색 점선)
  const sw=Math.min(S.sp,S.w/3), sd=Math.min(S.sp,S.d/3);
  ctx.strokeStyle='#22cc88'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
  ctx.strokeRect(tx(sw), ty(sd), (S.w-sw*2)/S.w*rW, (S.d-sd*2)/S.d*rH);
  ctx.setLineDash([]);

  // 간격 표시
  ctx.fillStyle='#22cc88'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(sw.toFixed(2)+'m', (tx(0)+tx(sw))/2, ty(sd)+14);
  ctx.fillText(sd.toFixed(2)+'m', tx(sw)-14, (ty(0)+ty(sd))/2+4);

  // 대각선 (1→5, 2→4)
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(tx(S.pts[0].x),ty(S.pts[0].y)); ctx.lineTo(tx(S.pts[4].x),ty(S.pts[4].y)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx(S.pts[1].x),ty(S.pts[1].y)); ctx.lineTo(tx(S.pts[3].x),ty(S.pts[3].y)); ctx.stroke();
  ctx.setLineDash([]);

  // 코너 연결
  ctx.strokeStyle='rgba(255,140,50,0.4)'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(tx(S.pts[1].x),ty(S.pts[1].y));
  ctx.lineTo(tx(S.pts[0].x),ty(S.pts[0].y));
  ctx.lineTo(tx(S.pts[3].x),ty(S.pts[3].y));
  ctx.lineTo(tx(S.pts[4].x),ty(S.pts[4].y));
  ctx.closePath(); ctx.stroke();

  // ★ 포인트 마커
  S.pts.forEach(p=>{
    const x=tx(p.x), y=ty(p.y);
    const ic = p.id===3;
    const pr = ic ? 18 : 14;

    // 글로우
    ctx.beginPath(); ctx.arc(x,y,pr+6,0,Math.PI*2);
    ctx.fillStyle = ic ? 'rgba(255,68,102,0.3)' : 'rgba(255,140,50,0.3)';
    ctx.fill();

    // 원
    ctx.beginPath(); ctx.arc(x,y,pr,0,Math.PI*2);
    ctx.fillStyle = ic ? '#ff4466' : '#ff8c32';
    ctx.fill();

    // 번호
    ctx.fillStyle='#fff'; ctx.font=`bold ${ic?16:14}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.id, x, y);

    // 라벨 (이름 + 좌표)
    ctx.fillStyle='rgba(0,0,0,0.7)';
    const lw=80, lh=28;
    ctx.fillRect(x-lw/2, y+pr+4, lw, lh);
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif';
    ctx.fillText(p.lb, x, y+pr+14);
    ctx.fillStyle='#aaa'; ctx.font='9px monospace';
    ctx.fillText(p.x.toFixed(2)+' × '+p.y.toFixed(2), x, y+pr+26);
  });

  // 면적 (중앙)
  ctx.globalAlpha = Math.min(alphaPct+0.2, 1);
  ctx.fillStyle='rgba(0,0,0,0.6)';
  const cx=tx(S.w/2), cy=ty(S.d/2)+40;
  ctx.fillRect(cx-50, cy-10, 100, 22);
  ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
  ctx.fillText(S.area.toFixed(1)+'m² | 간격'+S.sp.toFixed(2)+'m', cx, cy+4);

  ctx.globalAlpha = 1;
}

// Camera
let camStream=null;
async function startCam() {
  try {
    const vid=document.getElementById('camVid');
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    vid.srcObject=camStream;
    vid.onloadedmetadata=()=>{
      const ol=document.getElementById('olCanvas');
      ol.width=vid.videoWidth; ol.height=vid.videoHeight;
      drawOL();
    };
  } catch(e) { showToast('카메라를 사용할 수 없습니다'); }
}
function stopCam() { if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;} }

// Navigation
function goStep(n) {
  ['p1','p2','p3'].forEach((id,i)=>document.getElementById(id).style.display=i+1===n?'':'none');
  for(let i=1;i<=3;i++){
    document.getElementById('s'+i).className='step-dot'+(i<n?' done':i===n?' active':'');
    document.getElementById('s'+i).parentElement.querySelector('.step-label').className='step-label'+(i<=n?' active':'');
  }
  document.getElementById('l1').className='step-line'+(n>=2?' active':'');
  document.getElementById('l2').className='step-line'+(n>=3?' active':'');

  if(n===2){ stopCam(); setTimeout(()=>drawDiag('dCanvas'),100); }
  if(n===3){
    document.getElementById('cW').textContent=S.w.toFixed(2)+'m';
    document.getElementById('cD').textContent=S.d.toFixed(2)+'m';
    document.getElementById('cS').textContent=S.sp.toFixed(2)+'m';
    document.getElementById('cA').textContent=S.area.toFixed(1)+'m²';
    startCam();
    setTimeout(()=>drawDiag('dCanvas2'),100);
  }
}

function share() {
  const sw=Math.min(S.sp,S.w/3), sd=Math.min(S.sp,S.d/3);
  const t=`AMA 측정결과\n가로:${S.w.toFixed(2)}m 세로:${S.d.toFixed(2)}m\n면적:${S.area.toFixed(1)}m² 간격:${S.sp.toFixed(2)}m\n대각선(1→5):${S.diag.toFixed(2)}m\n\n`+
    S.pts.map(p=>`${p.id}번(${p.lb}): 가로${p.x.toFixed(2)}m 세로${p.y.toFixed(2)}m`).join('\n')+
    `\n\n벽→포인트: 가로${sw.toFixed(2)}m 세로${sd.toFixed(2)}m`;
  if(navigator.share) navigator.share({title:'AMA',text:t});
  else navigator.clipboard.writeText(t).then(()=>showToast('복사됨'));
}

function resetAll() { stopCam(); S={w:0,d:0,area:0,sp:0,pts:[],diag:0}; wIn.value=''; dIn.value=''; calcBtn.disabled=true; goStep(1); }
function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
window.addEventListener('resize',()=>{ if(S.pts.length) setTimeout(()=>{drawDiag('dCanvas');drawDiag('dCanvas2');drawOL();},100); });
</script>
